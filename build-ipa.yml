name: iTalya

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Générer le projet iOS
        run: npx expo prebuild --platform ios --clean

      - name: Installer les pods
        working-directory: ios
        run: pod install

      - name: Compiler l'app sans signature
        working-directory: ios
        run: |
          xcodebuild -workspace *.xcworkspace \
            -scheme MonApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_ENTITLEMENTS="" \
            clean build

      - name: Créer le fichier IPA
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: |
          mkdir Payload
          cp -r *.app Payload/
          zip -r MonApp.ipa Payload

      - name: Télécharger l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: MonApp-ipa
          path: ios/build/Build/Products/Release-iphoneos/MonApp.ipa
