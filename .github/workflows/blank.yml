name: Build IPA non signé

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les fichiers du projet
        run: |
          for f in package.json app.json App.js; do
            if [ ! -f "$f" ]; then
              echo "Fichier manquant à la racine : $f"
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Générer le projet iOS
        run: npx expo prebuild --platform ios --clean

      - name: Installer les pods
        working-directory: ios
        run: pod install

      - name: Compiler sans signature
        working-directory: ios
        run: |
          xcodebuild \
            -workspace iTalya.xcworkspace \
            -scheme iTalya \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Créer le fichier IPA
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: |
          mkdir -p Payload
          cp -r iTalya.app Payload/
          zip -r iTalya.ipa Payload

      - name: Télécharger l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: iTalya-ipa
          path: ios/build/Build/Products/Release-iphoneos/iTalya.ipa
          if-no-files-found: error
